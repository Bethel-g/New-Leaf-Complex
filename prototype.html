function fmtDate(d){
  if (!d) return '-';
  var dt = new Date(String(d).replace(' ','T'));
  if (isNaN(dt.getTime())) return String(d);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' &middot; ' +
         dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function relDate(d){
  var dt = new Date(String(d).replace(' ','T'));
  var days = Math.round((Date.now() - dt.getTime())/86400000);
  if (days <= 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + ' days ago';
  if (days < 30) return Math.floor(days/7) + ' wk ago';
  return Math.floor(days/30) + ' mo ago';
}

function hBars(items, color){
  var max = 0;
  items.forEach(function(i){ if (i.value > max) max = i.value; });
  if (!max) max = 1;
  return '<div class="space-y-3.5">' + items.map(function(i){
    return '<div><div class="flex items-center justify-between text-xs mb-1.5">' +
      '<span class="text-gray-600 font-medium truncate">' + i.label + '</span>' +
      '<span class="text-gray-800 font-bold tnum ml-2">' + i.value + '</span></div>' +
      '<div class="h-2 rounded-full bg-gray-100 overflow-hidden"><div class="h-full rounded-full" style="width:' +
      (i.value/max*100).toFixed(1) + '%;background:' + (i.color || color || '#059669') + '"></div></div></div>';
  }).join('') + '</div>';
}
function donut(data, size, thick){
  size = size || 170; thick = thick || 24;
  var total = 0;
  data.forEach(function(d){ total += d.value; });
  if (!total) total = 1;
  var r = (size-thick)/2, c = size/2, circ = 2*Math.PI*r, off = 0;
  var segs = data.map(function(d){
    var len = d.value/total*circ;
    var s = '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+thick+
      '" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+
      '" transform="rotate(-90 '+c+' '+c+')"><title>'+d.label+': '+d.value+'</title></circle>';
    off += len; return s;
  }).join('');
  return '<div class="flex items-center gap-5 flex-wrap"><div class="relative shrink-0" style="width:'+size+'px;height:'+size+'px">' +
    '<svg viewBox="0 0 '+size+' '+size+'" class="w-full h-full">'+segs+'</svg>' +
    '<div class="absolute inset-0 flex flex-col items-center justify-center">' +
    '<div class="text-2xl font-extrabold text-gray-900 tnum leading-none">'+total+'</div>' +
    '<div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mt-1">total</div></div></div>' +
    '<div class="space-y-2 min-w-[160px] flex-1">' + data.map(function(d){
      return '<div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:'+d.color+'"></span>' +
        '<span class="text-gray-600 truncate flex-1">'+d.label+'</span><span class="font-bold text-gray-800 tnum">'+d.value+'</span>' +
        '<span class="text-gray-400 tnum w-9 text-right">'+Math.round(d.value/total*100)+'%</span></div>';
    }).join('') + '</div></div>';
}
function groupedBars(data, colors, w, h){
  w = w || 620; h = h || 190;
  var max = 1;
  data.forEach(function(d){ d.values.forEach(function(v){ if (v > max) max = v; }); });
  var pad = 30, bw = (w-pad*2)/data.length, bars = '';
  data.forEach(function(d,i){
    var grpW = bw*0.6, gw = grpW/d.values.length;
    d.values.forEach(function(v,j){
      var bh = v/max*(h-46);
      var x = pad + i*bw + (bw-grpW)/2 + j*gw;
      bars += '<rect x="'+x.toFixed(1)+'" y="'+(h-24-bh).toFixed(1)+'" width="'+(gw-5).toFixed(1)+'" height="'+bh.toFixed(1)+
        '" rx="4" fill="'+colors[j]+'"><title>'+d.m+': '+v+'</title></rect>';
    });
    bars += '<text x="'+(pad+i*bw+bw/2).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="11" fill="#9ca3af" font-weight="700">'+d.m+'</text>';
  });
  var grid = [0,.25,.5,.75,1].map(function(f){
    var y = (h-24) - f*(h-46);
    return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#f3f4f6"/>' +
           '<text x="'+(pad-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="#d1d5db">' + Math.round(f*max) + '</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="w-full" style="min-height:170px">'+grid+bars+'</svg>';
}
function areaChart(values, color, labels, w, h){
  w = w || 620; h = h || 190;
  var max = 1;
  values.forEach(function(v){ if (v > max) max = v; });
  var pad = 28;
  var xs = function(i){ return pad + i*((w-pad*2)/(values.length-1)); };
  var ys = function(v){ return (h-24) - (v/max)*(h-52); };
  var line = values.map(function(v,i){ return xs(i).toFixed(1)+','+ys(v).toFixed(1); }).join(' ');
  var area = pad+','+(h-24)+' '+line+' '+(w-pad)+','+(h-24);
  var dots = values.map(function(v,i){
    return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="3.5" fill="#fff" stroke="'+color+'" stroke-width="2.5"><title>'+v+'</title></circle>';
  }).join('');
  var lbls = values.map(function(v,i){
    return '<text x="'+xs(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="11" fill="#9ca3af" font-weight="700">'+labels[i]+'</text>';
  }).join('');
  var grid = [0,.5,1].map(function(f){ var y=(h-24)-f*(h-52); return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#f3f4f6"/>'; }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="w-full" style="min-height:165px">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".25"/>' +
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<polygon points="'+area+'" fill="url(#ag)"/>' +
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + lbls + '</svg>';
}

        '<div class="flex items-center gap-2.5">' + avatar(s.author,'w-9 h-9 text-xs') +

      statCard('Suggestions implemented', SUGGESTIONS.filter(function(s){ return s.status === 'Implemented'; }).length, 'lightbulb', 'emerald', 'of ' + SUGGESTIONS.length + ' received') +
    '</div>' +

    '<div class="grid lg:grid-cols-3 gap-6">' +
      '<div class="lg:col-span-2 space-y-6">' +

          [['Peak month','Aug','84'],['Busiest dept',deptItems[0].label,String(deptItems[0].value)],['Top category',catItems[0].label,String(catItems[0].value)],['Avg response','0.4 d','']].map(function(s){

      '<div class="p-5 grid sm:grid-cols-2 gap-2.5">' + roles.map(function(r){
        var on = state.role === r;
        return '<button data-act="switch-role" data-arg="' + r + '" class="text-left p-3.5 rounded-xl border-2 transition-colors ' +
          (on ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200 hover:border-gray-300') + '">' +
          '<div class="flex items-center gap-2.5">' + avatar(USERS[r].name,'w-8 h-8 text-[11px] ring-0') +
          '<div class="min-w-0"><div class="text-sm font-bold ' + (on ? 'text-emerald-800' : 'text-gray-800') + '">' + esc(ROLE_LABEL[r]) + '</div>' +
          '<div class="text-[11px] text-gray-500 truncate">' + esc(USERS[r].name) + '</div></div>' +
          (on ? '<span class="ml-auto text-emerald-600">' + icon('check','w-4 h-4') + '</span>' : '') + '</div>' +
          '<div class="text-[11px] text-gray-500 mt-2 leading-snug">' + esc(desc[r]) + '</div></button>';
      }).join('') + '</div>' +
      '<div class="px-5 pb-5 flex items-center gap-2 text-[11px] text-gray-400">' + icon('info','w-3.5 h-3.5') +
        'In the live system a user has exactly one role and cannot change it.</div>' +
    '</div></div>';
}

function toastLayer(){
  if (!state.toast) return '';
  var tones = {
    emerald:'bg-gray-900 text-white', blue:'bg-blue-600 text-white',
    red:'bg-red-600 text-white', orange:'bg-orange-600 text-white'
  };
  return '<div class="fixed bottom-5 right-5 z-[60] max-w-sm pop-in">' +
    '<div class="flex items-start gap-3 px-4 py-3 rounded-xl shadow-pop ' + (tones[state.toast.tone] || 'bg-gray-900 text-white') + '">' +
      icon('info','w-5 h-5 shrink-0 mt-0.5 opacity-90') +
      '<div class="text-sm font-semibold leading-snug">' + esc(state.toast.msg) + '</div>' +
      '<button data-act="dismiss-toast" class="shrink-0 opacity-70 hover:opacity-100">' + icon('x','w-4 h-4') + '</button>' +
    '</div></div>';
}

function render(){
  var root = document.getElementById('root');
  if (state.view === 'login' || !state.role) {
    root.innerHTML = viewLogin();
  } else {
    var v;
    switch (state.view) {
      case 'staff-dash': v = viewStaffDash(); break;
      case 'it-dash': v = viewTeamDash('it'); break;
      case 'mt-dash': v = viewTeamDash('maintenance'); break;
      case 'it-tickets': v = viewTickets('it', false); break;
      case 'it-assigned': v = viewTickets('it', true); break;
      case 'mt-tickets': v = viewTickets('maintenance', false); break;
      case 'mt-assigned': v = viewTickets('maintenance', true); break;
      case 'all-requests': v = viewAllRequests(); break;
      case 'admin-dash': v = viewAdminDash(); break;
      case 'ticket': v = viewTicketDetail(state.arg); break;
      case 'my-requests': v = viewMyRequests(); break;
      case 'submit-it': v = viewSubmit('it'); break;
      case 'submit-mt': v = viewSubmit('maintenance'); break;
      case 'submit-sg': v = viewSubmit('sg'); break;
      case 'suggestions': v = viewSuggestions(); break;
      case 'my-suggestions': v = viewSuggestions(); break;
      case 'suggestion': v = viewSuggestionDetail(state.arg); break;
      case 'notifications': v = viewNotifications(); break;
      case 'profile': v = viewProfile(); break;
      case 'reports': v = viewReports(); break;
      case 'admin-users': v = viewAdminUsers(); break;
      case 'admin-departments': v = viewAdminDepts(); break;
      case 'admin-categories': v = viewAdminCategories(); break;
      case 'admin-settings': v = viewAdminSettings(); break;
      case 'admin-audit': v = viewAdminAudit(); break;
      case 'mm-dash': v = viewMMDash(); break;
      case 'mm-devices': v = viewMMDevices(); break;
      case 'mm-broadcast': v = viewMMBroadcast(); break;
      case 'mm-media': v = viewMMMedia(); break;
      case 'mm-groups': v = viewMMGroups(); break;
      case 'mm-locations': v = viewMMLocations(); break;
      case 'mm-schedules': v = viewMMSchedules(); break;
      case 'mm-history': v = viewMMHistory(); break;
      case 'mm-commands': v = viewMMCommands(); break;
      case 'mm-settings': v = viewMMSettings(); break;
      default: v = viewStaffDash(); state.view = 'staff-dash';
    }
    root.innerHTML =
      '<div class="flex min-h-screen">' +
        sidebar() +
        (state.sidebar ? '<div data-act="close-sidebar" class="fixed inset-0 bg-gray-900/40 z-30 lg:hidden"></div>' : '') +
        '<div class="flex-1 min-w-0 flex flex-col">' +
          topbar() +
          '<main class="flex-1 p-4 sm:p-6 max-w-[1500px] w-full mx-auto">' + v + '</main>' +
          '<footer class="px-6 py-5 text-center text-[11px] text-gray-400 border-t border-gray-200 bg-white">' +
            'New Leaf Medical Complex &mdash; Operations Request &amp; Improvement System. UI prototype with fictional data, no backend is connected.' +
          '</footer>' +
        '</div>' +
      '</div>' + modalLayer() + toastLayer();
  }
  if (window.lucide && lucide.createIcons) lucide.createIcons();
}

function toast(msg, tone){
  state.toast = { msg: msg, tone: tone || 'emerald' };
  render();
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(function(){ state.toast = null; render(); }, 3600);
}

function exportCSV(){
  var head = ['Number','Type','Title','Category','Priority','Status','Requester','Department','Assignee','Created','Location'];
  var rows = TICKETS.map(function(t){
    return [t.num, t.type === 'it' ? 'IT' : 'Maintenance', t.title, t.category, t.priority, t.status, t.requester, t.dept, t.assignee, t.created, t.location];
  });
  var csv = [head].concat(rows).map(function(r){
    return r.map(function(c){ return '"' + String(c == null ? '' : c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');
  var blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'new-leaf-requests-' + state.role + '.csv';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast('Demo only, a CSV would download in the live system.');
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var arg = el.getAttribute('data-arg') || '';

  switch (act) {
    case 'nav': go(arg); break;
    case 'toast': toast(arg); break;
    case 'open-ticket': go('ticket', arg); break;
    case 'open-sug': go('suggestion', arg); break;
    case 'device': toast('Demo only, the device panel for ' + arg + ' would open here.'); break;
    case 'tab': state.tab[arg.split(':')[0]] = arg.split(':')[1]; render(); break;
    case 'period': state.period = arg; toast('Demo only, the period filter would change the data range.'); break;
    case 'mm-filter': state.mmFilter = arg; render(); break;
    case 'mm-tab': state.scheduleTab = arg; render(); break;
    case 'clear-filters': state.filters = { q:'', status:'', priority:'', type:'' }; render(); break;
    case 'export': exportCSV(); break;
    case 'modal': state.modal = arg; render(); break;
    case 'close-modal': state.modal = null; render(); break;
    case 'dismiss-toast': state.toast = null; render(); break;
    case 'read-all':
      state.notifications.forEach(function(n){ n.read = true; });
      toast('All notifications marked as read.');
      break;
    case 'open-sidebar': state.sidebar = true; render(); break;
    case 'close-sidebar': state.sidebar = false; render(); break;
    case 'user-menu': state.userMenu = !state.userMenu; render(); break;
    case 'role-switch': openRoleModal(); break;
    case 'demo':
      state.role = arg;
      state.view = ROLE_HOME[arg];
      state.filters = { q:'', status:'', priority:'', type:'' };
      render();
      toast('Signed in as ' + me().name + '.');
      break;
    case 'logout':
      state.role = 'staff'; state.view = 'login'; state.arg = null; state.userMenu = false;
      state.filters = { q:'', status:'', priority:'', type:'' };
      render();
      break;
    case 'switch-role':
      state.role = arg;
      state.view = ROLE_HOME[arg];
      state.modal = null;
      state.userMenu = false;
      state.filters = { q:'', status:'', priority:'', type:'' };
      render();
      toast('Now viewing the system as ' + ROLE_LABEL[arg] + '.');
      break;
  }
});

function openRoleModal(){
  var roles = ['staff','it_staff','it_supervisor','maintenance_staff','maintenance_supervisor','admin','sys_admin'];
  state.userMenu = false;
  state.modal = 'roles';
  render();
}

document.addEventListener('change', function(e){
  var el = e.target;
  if (el.getAttribute && el.getAttribute('data-filter')) {
    state.filters[el.getAttribute('data-filter')] = el.value;
    render();
  }
});

var searchTimer;
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el.getAttribute) return;
  if (el.getAttribute('data-filter') === 'q') {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ state.filters.q = el.value; render(); }, 250);
  }
  if (el.getAttribute('data-global-search') !== null && el.hasAttribute('data-global-search')) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      var q = el.value.trim();
      if (!q) { toast('Demo only, global search would look across every module.'); return; }
      state.filters = { q:q, status:'', priority:'', type:'' };
      var found = TICKETS.filter(function(t){
        return (t.num + ' ' + t.title + ' ' + t.requester + ' ' + t.category).toLowerCase().indexOf(q.toLowerCase()) !== -1;
      })[0];
      state.view = found && (isITRole() || isMTRole()) ? 'ticket' : 'my-requests';
      state.arg = found ? found.id : null;
      render();
    }, 350);
  }
});

document.addEventListener('submit', function(e){
  if (e.target && e.target.id === 'login-form') {
    e.preventDefault();
    var email = (document.getElementById('lg-email') || {}).value || '';
    var pass = (document.getElementById('lg-pass') || {}).value || '';
    var role = null;
    Object.keys(USERS).forEach(function(r){ if (USERS[r].email === email.trim()) role = r; });
    if (!role || pass !== 'password123') {
      var err = document.getElementById('login-error');
      if (err) err.classList.remove('hidden');
      return;
    }
    state.role = role;
    state.view = ROLE_HOME[role];
    state.filters = { q:'', status:'', priority:'', type:'' };
    render();
    toast('Welcome back, ' + me().name + '.');
  }
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    if (state.modal) { state.modal = null; render(); }
    else if (state.userMenu) { state.userMenu = false; render(); }
    else if (state.sidebar) { state.sidebar = false; render(); }
  }
});

/* ------------------------------- 9. BOOT --------------------------------- */
state.role = null;
state.view = 'login';
render();
</script>
</body>
</html>
